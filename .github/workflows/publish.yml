name: Publish to NPM

on:
  push:
    branches:
      - master
    paths:
      - 'lerna.json'

jobs:
  publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install oathtool for 2FA
        run: sudo apt-get install --fix-broken --yes oathtool

      - name: Configure NPM Authentication
        run: |
          cat << EOF > .npmrc
          //registry.npmjs.org/:_authToken=$NPM_TOKEN
          registry=https://registry.npmjs.org/
          always-auth=true
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Verify NPM Authentication
        run: |
          NPM_USER=$(npm whoami)
          echo "Authenticated as: $NPM_USER"

      - name: Create git tag
        id: create_tag
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git tag -a "v$VERSION" -m "Release v$VERSION"

      - name: Publish to NPM
        run: |
          TOTP=$(oathtool --base32 --totp "${NPM_TOTP_DEVICE}")

          yarn lerna publish from-git \
            --yes \
            --no-verify-access \
            --otp $TOTP
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOTP_DEVICE: ${{ secrets.NPM_TOTP_DEVICE }}

      - name: Push git tag
        if: success()
        run: |
          git push origin "v${{ steps.create_tag.outputs.version }}"

      - name: Clean up NPM config
        if: always()
        run: rm -f .npmrc
